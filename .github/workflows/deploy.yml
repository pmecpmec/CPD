# Continuous deployment: elke merge naar main publiceert de webversie op GitHub Pages.
#
# Eenmalig instellen in de repository: Settings -> Pages -> Source op "GitHub Actions".
# Pas hieronder REPO_NAAM aan naar de naam van je repository, anders laden de assets niet.

name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  REPO_NAAM: CPD

jobs:
  bouwen:
    name: Webversie bouwen
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build web --release --base-href "/${{ env.REPO_NAAM }}/"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  publiceren:
    name: Publiceren
    needs: bouwen
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
